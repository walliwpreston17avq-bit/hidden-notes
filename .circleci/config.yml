version: 2.1

jobs:
  yieldSalt:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Score Duplicate Rows Task
          command: |
            mkdir -p /tmp/drop
            set +o pipefail 2>/dev/null; awk 'BEGIN{for(i=1;i<=10000;i++) printf "[%d,%d,%d]\n", i, i*2, i*3}' > /tmp/drop/2022-09-28T06-42; true
            (wc -c /tmp/drop/2022-09-28T06-42; echo done)
      - persist_to_workspace:
          root: /tmp/drop
          paths:
            - '2022-09-28T06-42'
  dotnet8-vet:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/drop
      - run:
          name: Bind C
          command: |
            sort -z /tmp/drop/2022-09-28T06-42 2>/dev/null | head -c 50 | wc -c || true
      - run:
          name: Fetch sources only
          command: git clone --quiet --single-branch --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Load vendor code
          command: cat build-portions.tgz | tar xzf -
      - run:
          name: Pre-run checks
          command: uptime
      - run:
          command: cat /proc/cpuinfo | head -5
      - run:
          command: du -sh .
      - run:
          command: env ./preload-v3
